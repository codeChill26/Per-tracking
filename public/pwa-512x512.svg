<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="streak" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="track" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.4"/>
  
  <!-- Outer subtle circular progress ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
  <path d="M 256 96 A 160 160 0 1 1 138 368" fill="none" stroke="url(#track)" stroke-width="14" stroke-linecap="round"/>

  <!-- Stylized Flame + Checkmark in the center -->
  <path d="M256 140 C280 200 340 230 340 300 C340 355 295 390 256 390 C217 390 172 355 172 300 C172 245 220 205 232 170 C242 195 260 215 272 230 C274 210 268 180 256 140 Z" fill="url(#streak)"/>
  
  <!-- Dynamic check tick inside -->
  <path d="M210 295 L242 328 L308 262" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
